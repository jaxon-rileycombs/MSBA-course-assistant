<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5c7186"/>
    </marker>
    <marker id="arrow-remove" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d64545"/>
    </marker>
  </defs>

  <!-- ============ CLASS SERVICES BAND (remote) ============ -->
  <rect x="40" y="20" width="1160" height="110" rx="14" fill="none" stroke="#2d7ff9" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="60" y="46" font-size="15" font-weight="600" fill="#1f4fa3">Class services — dobolyi.com (ports 9001–9005, remote)</text>
  <text x="60" y="66" font-size="12" fill="#5c7186">vLLM-served models, OpenAI-compatible APIs · keys from local .env · never committed</text>

  <g font-size="12" fill="#243348">
    <rect x="60" y="82" width="205" height="34" rx="8" fill="#eaf2ff" stroke="#2d7ff9"/>
    <text x="70" y="103">9001 Vision LLM · Qwen3.6-35B</text>
    <rect x="280" y="82" width="205" height="34" rx="8" fill="#eaf2ff" stroke="#2d7ff9"/>
    <text x="290" y="103">9002 Text embeddings · Nemotron-1B</text>
    <rect x="500" y="82" width="250" height="34" rx="8" fill="#eaf2ff" stroke="#2d7ff9"/>
    <text x="510" y="103">9003 Visual embeddings · Qwen3-VL-Embed</text>
    <rect x="765" y="82" width="250" height="34" rx="8" fill="#eaf2ff" stroke="#2d7ff9"/>
    <text x="775" y="103">9004 Multimodal rerank · Qwen3-VL-Reranker</text>
    <rect x="1030" y="82" width="170" height="34" rx="8" fill="#eaf2ff" stroke="#2d7ff9"/>
    <text x="1040" y="103">9005 Parsing · dots.mocr</text>
  </g>

  <!-- ============ UI LAYER ============ -->
  <rect x="60" y="160" width="520" height="64" rx="10" fill="#f4f7fb" stroke="#8496ab"/>
  <text x="80" y="185" font-size="14" font-weight="600" fill="#243348">Gradio UI (local browser)</text>
  <text x="80" y="205" font-size="12" fill="#5c7186">Materials · Ask · Quiz tabs — document add/remove, Q&amp;A with citations, quiz flow</text>

  <rect x="640" y="160" width="560" height="64" rx="10" fill="#f4f7fb" stroke="#8496ab"/>
  <text x="660" y="185" font-size="14" font-weight="600" fill="#243348">Outputs (UI)</text>
  <text x="660" y="205" font-size="12" fill="#5c7186">Answer + sources + slide images · quiz score + explanations · supported-format messages</text>

  <!-- ============ DOCUMENT PREPARATION ============ -->
  <text x="60" y="270" font-size="13" font-weight="600" fill="#5c7186">DOCUMENT PREPARATION — local</text>
  <rect x="60" y="280" width="170" height="52" rx="10" fill="#f4f7fb" stroke="#8496ab"/>
  <text x="76" y="302" font-size="12.5" font-weight="600" fill="#243348">Materials</text>
  <text x="76" y="320" font-size="11.5" fill="#5c7186">Canvas: PDF, PPTX, DOCX, MD…</text>

  <line x1="230" y1="306" x2="278" y2="306" stroke="#5c7186" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="282" y="280" width="200" height="52" rx="10" fill="#f4f7fb" stroke="#8496ab"/>
  <text x="298" y="302" font-size="12.5" font-weight="600" fill="#243348">Parse (local + 9005)</text>
  <text x="298" y="320" font-size="11.5" fill="#5c7186">text + original page/slide images · sha256 doc_id</text>

  <line x1="482" y1="306" x2="530" y2="306" stroke="#5c7186" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="534" y="280" width="200" height="52" rx="10" fill="#f4f7fb" stroke="#8496ab"/>
  <text x="550" y="302" font-size="12.5" font-weight="600" fill="#243348">Chunk</text>
  <text x="550" y="320" font-size="11.5" fill="#5c7186">recursive 1200/150 · doc, page, section metadata</text>

  <line x1="734" y1="306" x2="782" y2="306" stroke="#5c7186" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="786" y="280" width="190" height="52" rx="10" fill="#fff7e8" stroke="#e8a33d"/>
  <text x="802" y="302" font-size="12.5" font-weight="600" fill="#243348">Registry</text>
  <text x="802" y="320" font-size="11.5" fill="#5c7186">dedupe (repeat upload = no-op)</text>

  <line x1="881" y1="332" x2="881" y2="450" stroke="#d64545" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-remove)"/>
  <text x="668" y="352" font-size="11.5" fill="#d64545">remove(doc_id) → cascade delete</text>
  <line x1="881" y1="332" x2="610" y2="450" stroke="#d64545" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-remove)"/>
  <line x1="881" y1="332" x2="1000" y2="450" stroke="#d64545" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-remove)"/>

  <!-- ============ INDEXES ============ -->
  <text x="60" y="440" font-size="13" font-weight="600" fill="#5c7186">INDEXES — kept separate (requirement)</text>
  <rect x="60" y="450" width="330" height="56" rx="10" fill="#f4f7fb" stroke="#8496ab"/>
  <text x="76" y="474" font-size="12.5" font-weight="600" fill="#243348">BM25 keyword index (bm25s, local)</text>
  <text x="76" y="492" font-size="11.5" fill="#5c7186">no API needed</text>

  <rect x="425" y="450" width="360" height="56" rx="10" fill="#f4f7fb" stroke="#8496ab"/>
  <text x="441" y="474" font-size="12.5" font-weight="600" fill="#243348">Text index — ChromaDB (9002)</text>
  <text x="441" y="492" font-size="11.5" fill="#5c7186">chunk vectors · Nemotron embeddings · local storage</text>

  <rect x="820" y="450" width="380" height="56" rx="10" fill="#f4f7fb" stroke="#8496ab"/>
  <text x="836" y="474" font-size="12.5" font-weight="600" fill="#243348">Visual index — ChromaDB (9003)</text>
  <text x="836" y="492" font-size="11.5" fill="#5c7186">page/slide render vectors · Qwen3-VL-Embeddings</text>

  <!-- ============ RETRIEVAL ============ -->
  <text x="60" y="560" font-size="13" font-weight="600" fill="#5c7186">RETRIEVAL → HYBRID RAG</text>
  <rect x="60" y="570" width="150" height="48" rx="10" fill="#eaf2ff" stroke="#2d7ff9"/>
  <text x="76" y="596" font-size="12.5" font-weight="600" fill="#243348">Question (text)</text>

  <line x1="210" y1="594" x2="246" y2="594" stroke="#5c7186" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="250" y="552" width="330" height="84" rx="10" fill="#fff7e8" stroke="#e8a33d"/>
  <text x="266" y="574" font-size="12.5" font-weight="600" fill="#243348">Three retrievers (top-k each)</text>
  <text x="266" y="594" font-size="11.5" fill="#5c7186">keyword (BM25) · text-embedding (9002)</text>
  <text x="266" y="612" font-size="11.5" fill="#5c7186">visual-embedding — query → visual space (9003)</text>

  <line x1="580" y1="594" x2="616" y2="594" stroke="#5c7186" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="620" y="570" width="160" height="48" rx="10" fill="#f4f7fb" stroke="#8496ab"/>
  <text x="636" y="596" font-size="12.5" font-weight="600" fill="#243348">Fusion (weights)</text>

  <line x1="780" y1="594" x2="816" y2="594" stroke="#5c7186" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="820" y="570" width="240" height="48" rx="10" fill="#eaf2ff" stroke="#2d7ff9"/>
  <text x="836" y="596" font-size="12.5" font-weight="600" fill="#243348">Rerank (9004)</text>

  <line x1="1060" y1="594" x2="1096" y2="594" stroke="#5c7186" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="1100" y="558" width="110" height="76" rx="10" fill="#f4f7fb" stroke="#8496ab"/>
  <text x="1112" y="580" font-size="12" font-weight="600" fill="#243348">Evidence</text>
  <text x="1112" y="598" font-size="11" fill="#5c7186">doc · page/slide</text>
  <text x="1112" y="614" font-size="11" fill="#5c7186">excerpt · image paths</text>

  <!-- ============ ANSWER GENERATION ============ -->
  <text x="60" y="700" font-size="13" font-weight="600" fill="#5c7186">ANSWER &amp; QUIZ GENERATION</text>
  <rect x="60" y="710" width="350" height="80" rx="10" fill="#eaf2ff" stroke="#2d7ff9"/>
  <text x="76" y="734" font-size="12.5" font-weight="600" fill="#243348">Vision LLM (9001) — grounded prompt</text>
  <text x="76" y="752" font-size="11.5" fill="#5c7186">answer only from evidence; diagrams described from images</text>

  <line x1="410" y1="742" x2="446" y2="742" stroke="#5c7186" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="450" y="710" width="240" height="80" rx="10" fill="#f4f7fb" stroke="#8496ab"/>
  <text x="466" y="734" font-size="12.5" font-weight="600" fill="#243348">Structured output + validate</text>
  <text x="466" y="752" font-size="11.5" fill="#5c7186">{answer, sources[]} · schema + source-support check</text>
  <text x="466" y="768" font-size="11.5" fill="#5c7186">missing info → acknowledged, never invented</text>

  <line x1="690" y1="742" x2="726" y2="742" stroke="#5c7186" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="730" y="710" width="330" height="80" rx="10" fill="#f4f7fb" stroke="#8496ab"/>
  <text x="746" y="734" font-size="12.5" font-weight="600" fill="#243348">Citations renderer</text>
  <text x="746" y="752" font-size="11.5" fill="#5c7186">doc name + page/slide + section · verbatim excerpt</text>
  <text x="746" y="768" font-size="11.5" fill="#5c7186">original slide image shown as visual evidence</text>

  <rect x="1100" y="710" width="110" height="80" rx="10" fill="#eaf2ff" stroke="#2d7ff9"/>
  <text x="1112" y="734" font-size="12" font-weight="600" fill="#243348">Quiz (9001)</text>
  <text x="1112" y="752" font-size="10.5" fill="#5c7186">MCQ from chunks</text>
  <text x="1112" y="770" font-size="10.5" fill="#5c7186">fixed key · score</text>

  <!-- arrows up to UI -->
  <line x1="318" y1="790" x2="318" y2="232" stroke="#5c7186" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="252" y="520" font-size="11" fill="#5c7186" transform="rotate(-90 252 520)">answer + sources + images</text>
  <line x1="1155" y1="790" x2="1155" y2="232" stroke="#5c7186" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1180" y="505" font-size="11" fill="#5c7186" transform="rotate(90 1180 505)">quiz feedback + explanations</text>

  <!-- retrieval -> answer -->
  <line x1="1155" y1="634" x2="318" y2="710" stroke="#5c7186" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="700" y="662" font-size="11" fill="#5c7186">evidence bundle (chunks + images)</text></svg>
